# Builds one static binary per platform with checksums and version stamping.
# `make snapshot` runs it locally and publishes nothing; a `v*` tag runs .github/workflows/release.yml,
# which publishes a GitHub release.
version: 2

project_name: watchdep

builds:
  - id: watchdep
    main: ./cmd/watchdep
    binary: watchdep
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/kimathinjoki/watchdep-cli/internal/version.Version={{ .Version }}
      - -X github.com/kimathinjoki/watchdep-cli/internal/version.Commit={{ envOrDefault "WATCHDEP_COMMIT" .ShortCommit }}
      - -X github.com/kimathinjoki/watchdep-cli/internal/version.Date={{ .Date }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: watchdep
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "watchdep_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  disable: true

release:
  github:
    owner: kimathinjoki
    name: watchdep-cli
  # A repeated tag must not replace binaries whose checksums the Action already carries.
  mode: keep-existing
