version = 1
requires-python = ">=3.11"

[[package]]
name = "asgiref"
version = "3.7.2"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "django"
version = "4.2.0"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "asgiref" },
    { name = "sqlparse" },
]

[[package]]
name = "iniconfig"
version = "2.0.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "portal"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "django" },
]

[package.dev-dependencies]
dev = [
    { name = "pytest" },
]

[[package]]
name = "pytest"
version = "7.4.0"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "iniconfig" },
]

[[package]]
name = "sqlparse"
version = "0.4.3"
source = { registry = "https://pypi.org/simple" }
